name: Deploy CUL to Azure Static Web Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swa-cul-aserdargun-com-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate static release and browser flows
        run: npm run validate
        env:
          CUL_PREVIEW: '1'
      - name: Deploy verified static artifact
        id: deploy
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # official v1 branch
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SWA_CUL_ASERDARGUN_COM }}
          action: upload
          app_location: dist
          api_location: ''
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          production_branch: main
      - name: Verify deployed commit and assets
        env:
          CUL_BASE_URL: ${{ steps.deploy.outputs.static_web_app_url }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: node scripts/verify-live.mjs
      - name: Verify production browser flows
        env:
          CUL_BASE_URL: ${{ steps.deploy.outputs.static_web_app_url }}
        run: npm run test:ui
